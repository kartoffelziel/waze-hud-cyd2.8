; Waze HUD cho ESP32 CYD 2.8" (ESP32-2432S028) - nhận dữ liệu HLP/1 qua Bluetooth Classic SPP
;
; Chọn môi trường theo màn hình của bạn:
;   cyd         : ILI9341, màu bình thường (phổ biến nhất, board 1 cổng USB)
;   cyd_inv     : như trên nhưng đảo màu (dùng khi màn hình bị "âm bản")
;   cyd_st7789  : board 2 cổng USB dùng driver ST7789
; Nếu đỏ/xanh bị đổi chỗ, thêm  -DTFT_RGB_ORDER=TFT_BGR  vào build_flags.

[common]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Bluetooth Classic + Bluedroid rất nặng, cần phân vùng app lớn (không dùng OTA).
board_build.partitions = huge_app.csv
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.4
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT8=1
    -DHUD_ROTATION=1

[env:cyd]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = ${common.board_build.partitions}
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DILI9341_2_DRIVER=1

[env:cyd_inv]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = ${common.board_build.partitions}
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DILI9341_2_DRIVER=1
    -DTFT_INVERSION_ON=1

[env:cyd_st7789]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = ${common.board_build.partitions}
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DST7789_DRIVER=1
